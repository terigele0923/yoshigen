<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>吉源商事｜金属スクラップ買取・解体・輸出</title>
    <meta name="description" content="吉源商事は、日本国内の廃棄金属を買い取り、解体・選別後、東南アジアへ輸出する金属スクラップ商社です。">
    <script src="js/include.js"></script>
</head>
<body>

<main>
    <section class="hero-slider">
        <div id="lpCarousel" class="carousel slide carousel-fade" data-bs-ride="carousel" data-bs-interval="2000">
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#lpCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="1枚目"></button>
                <button type="button" data-bs-target="#lpCarousel" data-bs-slide-to="1" aria-label="2枚目"></button>
                <button type="button" data-bs-target="#lpCarousel" data-bs-slide-to="2" aria-label="3枚目"></button>
            </div>
            <div class="carousel-inner">
                <div class="carousel-item active hero-slide" style="background-image: url('images/background-image.png');"></div>
                <div class="carousel-item hero-slide" style="background-image: url('images/background-image02.png');"></div>
                <div class="carousel-item hero-slide" style="background-image: url('images/background-images03.png');"></div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#lpCarousel" data-bs-slide="prev" aria-label="前の画像">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#lpCarousel" data-bs-slide="next" aria-label="次の画像">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
            </button>
        </div>

        <div class="hero-overlay"></div>
        <div class="container hero-content">
            <div class="row min-vh-75 align-items-center">
                <div class="col-lg-8 col-xl-7">
                    <p class="hero-kicker">金属スクラップ買取・解体・輸出</p>
                    <h1 class="display-4 fw-bold mb-4">廃棄金属に<br>新しい価値を。</h1>
                    <p class="lead mb-4">吉源商事は、日本国内の廃棄金属を買い取り、解体・選別を行い、東南アジアへ輸出する金属スクラップ商社です。</p>
                    <a class="btn btn-danger btn-lg" href="contact.html">買取相談はこちら</a>
                </div>
            </div>
        </div>
    </section>

    <section class="section">
        <div class="container">
            <div class="row align-items-center g-4">
                <div class="col-lg-5">
                    <h2 class="section-title">吉源商事について</h2>
                </div>
                <div class="col-lg-7">
                    <p class="mb-0">工場、倉庫、解体現場などから発生する鉄・非鉄金属スクラップを適正に買い取り、再資源化に向けた解体・選別を行っています。</p>
                </div>
            </div>
        </div>
    </section>

    <section class="section section-muted">
        <div class="container">
            <h2 class="section-title mb-4">主なサービス</h2>
            <div class="row g-4">
                <div class="col-md-4">
                    <a class="card service-card link-card h-100" href="services/service-purchase.html">
                        <div class="card-body">
                            <h3 class="h5 card-title">金属スクラップ買取</h3>
                            <p class="card-text">鉄、銅、アルミ、ステンレス、真鍮、雑線などを買い取ります。</p>
                        </div>
                    </a>
                </div>
                <div class="col-md-4">
                    <a class="card service-card link-card h-100" href="services/service-sorting.html">
                        <div class="card-body">
                            <h3 class="h5 card-title">解体・選別</h3>
                            <p class="card-text">回収した金属を種類ごとに分け、再利用しやすい状態に整えます。</p>
                        </div>
                    </a>
                </div>
                <div class="col-md-4">
                    <a class="card service-card link-card h-100" href="services/service-export.html">
                        <div class="card-body">
                            <h3 class="h5 card-title">東南アジア輸出</h3>
                            <p class="card-text">選別した金属資源を東南アジアの取引先へ輸出します。</p>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
</body>
</html>
